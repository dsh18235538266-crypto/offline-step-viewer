[project]
name = "step-modeler-mcp"
version = "0.1.0"
description = "MCP plugin for conversational STEP model creation/editing with real-time HTML viewer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Bruce" }]
keywords = ["mcp", "step", "cad", "build123d", "robotics", "arm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "build123d>=0.8.0",
    "mcp>=1.0.0",
    "websockets>=12.0",
]

[project.scripts]
step-modeler-mcp = "step_modeler.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/step_modeler"]

[tool.hatch.build.targets.wheel.force-include]
"viewer/index.html" = "step_modeler/viewer/index.html"
