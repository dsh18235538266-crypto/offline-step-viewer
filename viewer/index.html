<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STEP Modeler — Live Viewer</title>
<style>
:root{--ink:#eaf2f8;--line:rgba(151,181,204,.16);--orange:#f28b38;--cyan:#4cc9f0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080d12;color:var(--ink)}
body{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
.shell{min-height:100vh;padding:0 28px 28px}
.top{height:84px;max-width:1540px;margin:auto;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:13px}
.mark{color:var(--orange);font-size:22px}
.brand small{display:block;color:#748695;font-size:10px;font-weight:800;letter-spacing:.2em}
.brand h1{margin:3px 0 0;font-size:18px}
.ok{color:#92a3af;font:600 11px ui-monospace,monospace}
.ok:before{content:"";display:inline-block;width:7px;height:7px;margin-right:8px;border-radius:50%;background:#56d68b;box-shadow:0 0 12px #56d68b}
.workspace{max-width:1540px;margin:22px auto 0;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;min-height:calc(100vh - 134px)}
.viewer,.panel{border:1px solid var(--line);background:rgba(14,22,30,.85);box-shadow:0 20px 70px rgba(0,0,0,.28)}
.viewer{min-height:680px;display:grid;grid-template-rows:1fr auto;overflow:hidden}
.stage{min-height:590px;position:relative;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 42%,transparent 0 34%,rgba(2,6,10,.2) 76%,rgba(2,5,8,.7))}
.loading{position:absolute;inset:0;z-index:3;display:grid;place-content:center;gap:12px;text-align:center;background:#0b1118;color:#aebdca;font-size:12px}
.loading[hidden]{display:none!important}
.loading i{width:34px;height:34px;margin:0 auto;border:2px solid #2a3942;border-top-color:var(--orange);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toolbar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:rgba(8,13,18,.6)}
.toolbar button{padding:8px 14px;border:1px solid var(--line);background:transparent;border-radius:8px;cursor:pointer;font-size:12px;letter-spacing:.04em;transition:.15s}
.toolbar button:hover{border-color:var(--cyan);color:var(--cyan)}
.toolbar button.active{border-color:var(--orange);color:var(--orange)}
.panel{padding:22px 24px}
.panel h2{margin:0 0 6px;font-size:15px;font-weight:500}
.panel .lede{color:#748695;font-size:13px;line-height:1.6;margin:0 0 18px}
.specs{display:grid;gap:10px}
.specs .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.specs .row span:first-child{color:#748695}
.specs .row span:last-child{font-family:ui-monospace,monospace;color:var(--cyan)}
.hint{margin-top:22px;padding:12px 14px;border:1px dashed var(--line);border-radius:8px;font-size:11px;color:#748695;line-height:1.6}
.hint b{color:var(--cyan)}
.conn{position:absolute;top:14px;right:14px;z-index:4;padding:5px 11px;border-radius:20px;font:600 10px ui-monospace,monospace;letter-spacing:.05em}
.conn.on{background:rgba(86,214,139,.16);color:#56d68b;border:1px solid rgba(86,214,139,.4)}
.conn.off{background:rgba(242,88,62,.16);color:#f2583e;border:1px solid rgba(242,88,62,.4)}
.conn.connecting{background:rgba(242,139,56,.16);color:var(--orange);border:1px solid rgba(242,139,56,.4)}
@media(max-width:980px){.workspace{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand">
      <span class="mark">◆</span>
      <div>
        <small>STEP MODELER · LIVE VIEWER</small>
        <h1>对话式 STEP 建模实时预览</h1>
      </div>
    </div>
    <div class="ok" id="status">等待模型</div>
  </div>
  <div class="workspace">
    <div class="viewer">
      <div class="stage" id="stage">
        <div class="conn off" id="conn">WS: 断开</div>
        <div class="loading" id="loading">
          <i></i>
          <span id="loading-msg">正在连接 WebSocket…</span>
        </div>
      </div>
      <div class="toolbar">
        <button id="rotate" class="active">自动旋转</button>
        <button id="wire">线框</button>
        <button id="reset">重置视角</button>
        <button id="shot">保存截图</button>
      </div>
    </div>
    <aside class="panel">
      <h2>实时预览</h2>
      <p class="lede">本页面通过 WebSocket 接收来自 step-modeler-mcp 的模型推送。在 Codex 中对话建模后，模型会自动在此刷新。</p>
      <div class="specs">
        <div class="row"><span>连接状态</span><span id="spec-conn">—</span></div>
        <div class="row"><span>模型来源</span><span id="spec-source">—</span></div>
        <div class="row"><span>顶点数</span><span id="spec-verts">—</span></div>
        <div class="row"><span>三角面数</span><span id="spec-tris">—</span></div>
        <div class="row"><span>包围盒</span><span id="spec-bbox">—</span></div>
      </div>
      <div class="hint">
        <b>使用方式：</b><br>
        1. 启动 step-modeler-mcp（自动启动 WS 服务）<br>
        2. 在 Codex 对话中建模<br>
        3. Agent 调用 push_to_viewer 后自动刷新
      </div>
    </aside>
  </div>
</div>
<script type="importmap">
{ "imports": { "three": "https://esm.sh/three@0.180.0", "three/addons/": "https://esm.sh/three@0.180.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const stage = document.getElementById('stage');
const loading = document.getElementById('loading');
const loadingMsg = document.getElementById('loading-msg');
const statusEl = document.getElementById('status');
const connEl = document.getElementById('conn');
const specConn = document.getElementById('spec-conn');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 10000);
camera.position.set(80, 60, 120);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xddeeff, 0x1a1a2a, 0.6);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(80, 120, 60);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -200; key.shadow.camera.right = 200;
key.shadow.camera.top = 200; key.shadow.camera.bottom = -200;
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aacc, 0.5);
fill.position.set(-60, 40, -80);
scene.add(fill);

const grid = new THREE.GridHelper(400, 40, 0x2a3942, 0x1a2230);
grid.material.opacity = 0.4; grid.material.transparent = true;
scene.add(grid);

const controls = new OrbitControls(camera, renderer.domElement);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.enableDamping = true;

let modelRoot = new THREE.Group();
scene.add(modelRoot);

function clearModel() {
  modelRoot.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) { Array.isArray(o.material) ? o.material.forEach(m=>m.dispose()) : o.material.dispose(); }
  });
  scene.remove(modelRoot);
  modelRoot = new THREE.Group();
  scene.add(modelRoot);
}

function fitView(group) {
  const box = new THREE.Box3().setFromObject(group);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 50;
  const dist = maxDim * 2.2;
  controls.target.copy(center);
  camera.position.set(center.x + dist*0.5, center.y + dist*0.4, center.z + dist*0.8);
  controls.update();
}

function buildFromMeshData(meshes) {
  const group = new THREE.Group();
  let totalVerts = 0, totalTris = 0;
  for (const m of meshes) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(m.vertices, 3));
    if (m.indices) geo.setIndex(m.indices);
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({
      color: m.color || 0x8e9aab,
      metalness: 0.28, roughness: 0.46,
      side: THREE.DoubleSide
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true; mesh.receiveShadow = true;
    group.add(mesh);
    totalVerts += m.vertices.length / 3;
    totalTris += m.indices ? m.indices.length / 3 : (m.vertices.length / 3 / 3);
  }
  return { group, totalVerts, totalTris };
}

function loadMeshData(meshes, source) {
  loading.hidden = false;
  loadingMsg.textContent = '正在渲染模型…';
  try {
    clearModel();
    const { group, totalVerts, totalTris } = buildFromMeshData(meshes);
    modelRoot.add(group);
    fitView(group);
    const box = new THREE.Box3().setFromObject(group);
    const size = box.getSize(new THREE.Vector3());
    document.getElementById('spec-source').textContent = source;
    document.getElementById('spec-verts').textContent = totalVerts.toLocaleString();
    document.getElementById('spec-tris').textContent = Math.round(totalTris).toLocaleString();
    document.getElementById('spec-bbox').textContent = `${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)} mm`;
    statusEl.textContent = `${source} · ${totalVerts} verts · 已渲染`;
    loading.hidden = true;
  } catch(e) {
    loadingMsg.innerHTML = `渲染失败: ${e.message}`;
    statusEl.textContent = '渲染失败';
  }
}

// ── WebSocket ──
const WS_URL = 'ws://127.0.0.1:8765';
let ws = null, wsRetry = null;

function setConn(state, label) {
  connEl.className = 'conn ' + state;
  connEl.textContent = label;
  specConn.textContent = label;
}

function connectWS() {
  setConn('connecting', 'WS: 连接中…');
  try { ws = new WebSocket(WS_URL); } catch(e) { setConn('off','WS: 不支持'); scheduleReconnect(); return; }
  ws.onopen = () => {
    setConn('on', 'WS: 已连接');
    loadingMsg.textContent = '已连接，等待模型推送…';
  };
  ws.onmessage = (evt) => {
    try {
      const msg = JSON.parse(evt.data);
      if (msg.type === 'hello') return;
      if (msg.type === 'mesh_update' && msg.meshes) {
        loadMeshData(msg.meshes, msg.source || 'push');
      }
    } catch(e) { console.error('WS msg error:', e); }
  };
  ws.onclose = () => { setConn('off','WS: 断开'); scheduleReconnect(); };
  ws.onerror = () => { setConn('off','WS: 错误'); };
}

function scheduleReconnect() {
  if (wsRetry) return;
  wsRetry = setTimeout(() => { wsRetry = null; connectWS(); }, 2000);
}

connectWS();

// ── UI ──
let wireOn = false;
document.getElementById('rotate').addEventListener('click', e => {
  controls.autoRotate = !controls.autoRotate;
  e.target.classList.toggle('active', controls.autoRotate);
});
document.getElementById('wire').addEventListener('click', e => {
  wireOn = !wireOn;
  e.target.classList.toggle('active', wireOn);
  modelRoot.traverse(o => { if(o.isMesh){ const ms=Array.isArray(o.material)?o.material:[o.material]; ms.forEach(m=>m.wireframe=wireOn);} });
});
document.getElementById('reset').addEventListener('click', () => { if(modelRoot.children.length) fitView(modelRoot); });
document.getElementById('shot').addEventListener('click', () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = 'STEP_3D.png';
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
});

function resize() {
  const w = stage.clientWidth, h = Math.max(stage.clientHeight, 1);
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

function animate() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(animate); }
animate();
</script>
</body>
</html>
